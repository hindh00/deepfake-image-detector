# Dataset sources and sampling plan

sources:
  community_forensics:
    hf_id: OwensLab/CommunityForensics-Small
    role: train
    generator_family: mixed

  genimage:
    hf_id: TheKernel01/Tiny-GenImage
    role: train_val
    generator_family: mixed # gan + diffusion, labeled per-example

  genimage_pp:
    hf_id: Lunahera/genimagepp
    role: held_out_eval # never used for training
    generator_family: diffusion # Flux.1 / SD3

  faceforensics:
    hf_id: bitmind/FaceForensicsC23
    role: train_val
    generator_family: gan_face_swap
    media_type: video # needs frame_extraction.py

  synthetic_faces_hq:
    hf_id: bitmind/SyntheticFacesHQ
    role: train_val
    generator_family: diffusion_face

sampling:
  # Originally 200k/20k, but that wasn't grounded in the actual size of these 5
  # sources - real images are the hard ceiling (fake is abundant: synthetic_faces_hq
  # alone has ~493k). Confirmed real availability per source: genimage 14,000 (its
  # full train split, perfectly label-balanced), community_forensics ~1,542 (its
  # last, real-only shard), faceforensics 1,000 videos x 5 frames = 5,000. Combined
  # ceiling is ~20,500 real, matched by an equal amount of fake after balancing -
  # roughly ~41k total pooled rows. build_manifest's per_source_cap is set high
  # enough (see ml/notebooks/02_colab_train.ipynb) that each source naturally
  # exhausts its own real supply rather than being cut off early.
  train_target: 33_000
  val_target: 4_000
  balance: real_fake_50_50
  stratify_by: generator_family

splits:
  train: 0.8
  val: 0.1
  test: 0.1
  # held_out_eval is NOT part of this ratio - it's the genimage_pp source entirely
